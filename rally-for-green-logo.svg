  <circle cx="300" cy="300" r="295" fill="#e9f5a1"/>
  <circle cx="300" cy="300" r="220" fill="#1a3a2a"/>
  <circle cx="300" cy="300" r="220" fill="none" stroke="#d4e157" stroke-width="4"/>
  <circle cx="300" cy="300" r="205" fill="none" stroke="#2d6a4f" stroke-width="1.5"/>
  <circle cx="300" cy="300" r="65" fill="#c8dc3a"/>
